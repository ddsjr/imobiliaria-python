<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imobiliária - Encontre seu Imóvel</title>
    <!-- Tailwind CSS para o design moderno do site -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Cabeçalho / Banner principal -->
    <header class="bg-blue-600 text-white py-10 shadow-md">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold mb-2">🏠 Imobiliária Python</h1>
            <p class="text-blue-100 text-lg">Encontre casas, apartamentos e salões comerciais em um só lugar.</p>
        </div>
    </header>

    <!-- Área principal do site -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Imóveis Disponíveis</h2>

        <!-- Onde os cartões dos imóveis vão aparecer -->
        <div id="lista-imoveis" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="text-gray-500">Carregando imóveis do banco de dados...</p>
        </div>
    </main>

    <!-- Script em JavaScript para buscar os dados da nossa API em Python -->
    <script>
        async function carregarImoveis() {
            try {
                // Chama a rota Python que criamos!
                const resposta = await fetch('/imoveis');
                const imoveis = await resposta.json();

                const container = document.getElementById('lista-imoveis');
                container.innerHTML = ''; // Limpa a mensagem de carregando

                // Para cada imóvel retornado do Supabase, cria um "cartão" visual
                imoveis.forEach(imovel => {
                    const card = `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
                            <img src="${imovel.imagem_url || 'https://via.placeholder.com/400x250'}" alt="${imovel.titulo}" class="w-full h-48 object-cover">
                            <div class="p-5">
                                <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-semibold uppercase mb-2">
                                    ${imovel.tipo} • ${imovel.categoria}
                                </span>
                                <h3 class="text-xl font-bold text-gray-900 mb-2">${imovel.titulo}</h3>
                                <p class="text-gray-600 text-sm mb-4 line-clamp-2">${imovel.descricao}</p>
                                <div class="text-gray-500 text-xs mb-4">
                                    📍 ${imovel.bairro}, ${imovel.cidade}
                                </div>
                                <div class="border-t pt-4 flex justify-between items-center">
                                    <span class="text-2xl font-bold text-blue-600">R$ ${Number(imovel.preco).toLocaleString('pt-BR')}</span>
                                    <div class="text-xs text-gray-500 space-x-2">
                                        <span>🛏️ ${imovel.quartos}</span>
                                        <span>🚿 ${imovel.banheiros}</span>
                                        <span>📐 ${imovel.area_m2}m²</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (erro) {
                console.error("Erro ao buscar imóveis:", erro);
                document.getElementById('lista-imoveis').innerHTML = '<p class="text-red-500">Erro ao carregar os imóveis.</p>';
            }
        }

        // Executa a busca assim que a página carregar
        carregarImoveis();
    </script>
</body>
</html>
