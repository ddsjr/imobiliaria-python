<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douglas Imóveis - Encontre o seu próximo lar</title>
    
    <!-- Google Fonts: Fonte Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 antialiased">

    <!-- 1. BANNER TOPO SUPERIOR -->
    <div class="bg-stone-950 text-white text-xs py-2 px-4 border-b border-stone-800 tracking-wide">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-5">
                <span class="flex items-center gap-1.5 font-medium">📞 (11) 3456-7890</span>
                <span class="flex items-center gap-1.5 font-medium">💬 WhatsApp (11) 98765-4321</span>
                <span class="hidden sm:inline text-stone-400">CRECI 12.345-J</span>
            </div>
            <div>
                <span class="border border-stone-700 px-3 py-1 rounded-full text-stone-300 bg-stone-900 font-semibold text-[11px]">Desde 1996</span>
            </div>
        </div>
    </div>

    <!-- 2. CABEÇALHO PRINCIPAL COM LOGO -->
    <header class="bg-[#a80808] text-white pt-5 pb-12 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            
            <!-- LOGO EM IMAGEM -->
            <div class="bg-white px-4 py-2 rounded-xl shadow-md flex items-center justify-center cursor-pointer" onclick="limparFiltros()">
                <img src="/static/logo.png" alt="Douglas Imóveis" class="h-12 w-auto object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/180x50?text=Douglas+Im%C3%B3veis';">
            </div>

            <!-- MENU DE NAVEGAÇÃO -->
            <nav class="flex flex-wrap items-center justify-center gap-2 sm:gap-5 text-sm font-semibold tracking-wide">
                <button onclick="limparFiltros()" class="bg-white text-gray-900 px-4 py-1.5 rounded-lg shadow-sm">Home</button>
                <button onclick="limparFiltros()" class="hover:text-red-200 transition">Imóveis</button>
                <a href="#" class="hover:text-red-200 transition">Quem somos</a>
                <a href="#" class="hover:text-red-200 transition">Jurídico</a>
                <a href="#" class="hover:text-red-200 transition">Contato</a>
            </nav>

            <!-- BOTÃO SIMULADOR CAIXA -->
            <a href="https://www.caixa.gov.br" target="_blank" class="bg-[#0066b3] hover:bg-sky-700 text-white px-4 py-2 rounded-lg font-semibold text-sm flex items-center gap-2 shadow transition">
                <i data-lucide="calculator" class="w-4 h-4"></i>
                Simulador Caixa
            </a>
        </div>

        <!-- TÍTULO DO HERO -->
        <div class="text-center max-w-3xl mx-auto px-4 mt-6">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-3">Encontre o seu próximo lar</h1>
            <p class="text-red-100 text-base md:text-lg font-normal">Casas, apartamentos e comerciais de alto padrão em um só lugar.</p>
        </div>

        <!-- BARRA DE BUSCA E FILTRO DE TIPO (VENDA / ALUGUEL) -->
        <div class="max-w-3xl mx-auto px-4 mt-8">
            <div class="bg-white p-2 rounded-full shadow-2xl flex flex-wrap md:flex-nowrap items-center gap-2 text-gray-700">
                
                <!-- Toggle Venda / Aluguel -->
                <div class="bg-gray-100 p-1 rounded-full flex items-center font-semibold text-xs">
                    <button id="btn-venda" onclick="filtrarTipo('venda')" class="px-5 py-2 rounded-full transition text-gray-600">Venda</button>
                    <button id="btn-aluguel" onclick="filtrarTipo('aluguel')" class="px-5 py-2 rounded-full transition text-gray-600">Aluguel</button>
                    <button id="btn-todos-tipo" onclick="filtrarTipo('')" class="px-3 py-2 rounded-full transition text-gray-400 hover:text-gray-700 text-[10px]">Todos</button>
                </div>

                <!-- Input Localização (Busca Rápida) -->
                <div class="flex items-center gap-2 flex-1 px-3 py-1 border-r border-gray-200">
                    <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
                    <input type="text" id="input-busca" placeholder="Digite cidade ou bairro..." class="w-full text-sm outline-none bg-transparent placeholder-gray-400 font-medium">
                </div>

                <!-- Botão Buscar -->
                <button onclick="carregarImoveis()" class="bg-red-600 hover:bg-red-700 text-white p-3 rounded-full transition shadow">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 3. ABAS DE CATEGORIAS -->
    <div class="bg-white border-b shadow-sm">
        <div class="max-w-5xl mx-auto px-4 flex flex-wrap justify-center md:justify-between items-center gap-6 py-3.5 text-sm font-semibold text-gray-600">
            <button onclick="filtrarCategoria('casa')" class="btn-cat flex items-center gap-2 hover:text-red-600 transition pb-1" data-cat="casa">
                <i data-lucide="home" class="w-4 h-4"></i> Casas
            </button>
            <button onclick="filtrarCategoria('apartamento')" class="btn-cat flex items-center gap-2 hover:text-red-600 transition pb-1" data-cat="apartamento">
                <i data-lucide="building" class="w-4 h-4"></i> Apartamentos
            </button>
            <button onclick="filtrarCategoria('comercial')" class="btn-cat flex items-center gap-2 hover:text-red-600 transition pb-1" data-cat="comercial">
                <i data-lucide="store" class="w-4 h-4"></i> Comercial
            </button>
            <button onclick="filtrarCategoria('sala')" class="btn-cat flex items-center gap-2 hover:text-red-600 transition pb-1" data-cat="sala">
                <i data-lucide="monitor" class="w-4 h-4"></i> Salas
            </button>
            <button onclick="filtrarCategoria('salao')" class="btn-cat flex items-center gap-2 hover:text-red-600 transition pb-1" data-cat="salao">
                <i data-lucide="warehouse" class="w-4 h-4"></i> Salões
            </button>
            <button onclick="filtrarCategoria('terreno')" class="btn-cat flex items-center gap-2 hover:text-red-600 transition pb-1" data-cat="terreno">
                <i data-lucide="mountain" class="w-4 h-4"></i> Terrenos
            </button>
        </div>
    </div>

    <!-- 4. CONTEÚDO PRINCIPAL (LISTAGEM DINÂMICA) -->
    <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="flex justify-between items-center mb-6">
            <h2 id="titulo-secao" class="text-2xl font-bold text-gray-900 tracking-tight">Imóveis em Destaque</h2>
            <button id="btn-limpar-filtros" onclick="limparFiltros()" class="hidden text-xs text-red-600 font-semibold hover:underline">
                🔄 Limpar filtros e mostrar todos
            </button>
        </div>

        <div id="lista-imoveis" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="text-gray-500 col-span-3">Carregando imóveis do banco de dados...</p>
        </div>
    </main>

    <!-- SCRIPT JAVASCRIPT DINÂMICO DOS FILTROS -->
    <script>
        lucide.createIcons();

        // Variáveis globais para guardar o estado atual dos filtros
        let filtroTipoAtual = '';
        let filtroCategoriaAtual = '';

        function atualizarEstiloBotoes() {
            // Atualiza estilo dos botões de Venda / Aluguel
            const btnVenda = document.getElementById('btn-venda');
            const btnAluguel = document.getElementById('btn-aluguel');

            if (filtroTipoAtual === 'venda') {
                btnVenda.className = "bg-red-600 text-white px-5 py-2 rounded-full shadow font-bold";
                btnAluguel.className = "text-gray-600 hover:text-gray-900 px-5 py-2 font-medium";
            } else if (filtroTipoAtual === 'aluguel') {
                btnAluguel.className = "bg-stone-900 text-white px-5 py-2 rounded-full shadow font-bold";
                btnVenda.className = "text-gray-600 hover:text-gray-900 px-5 py-2 font-medium";
            } else {
                btnVenda.className = "text-gray-600 hover:text-gray-900 px-5 py-2 font-medium";
                btnAluguel.className = "text-gray-600 hover:text-gray-900 px-5 py-2 font-medium";
            }

            // Atualiza destaque da aba de Categoria ativa
            const botoesCategoria = document.querySelectorAll('.btn-cat');
            botoesCategoria.forEach(btn => {
                const cat = btn.getAttribute('data-cat');
                if (cat === filtroCategoriaAtual) {
                    btn.className = "btn-cat flex items-center gap-2 text-red-600 font-bold border-b-2 border-red-600 pb-1";
                } else {
                    btn.className = "btn-cat flex items-center gap-2 text-gray-600 hover:text-red-600 transition pb-1 font-semibold";
                }
            });

            // Exibe ou oculta o botão de "Limpar Filtros"
            const btnLimpar = document.getElementById('btn-limpar-filtros');
            if (filtroTipoAtual || filtroCategoriaAtual) {
                btnLimpar.classList.remove('hidden');
            } else {
                btnLimpar.classList.add('hidden');
            }
        }

        function filtrarTipo(tipo) {
            // Se clicar no mesmo tipo selecionado, cancela a seleção
            filtroTipoAtual = (filtroTipoAtual === tipo) ? '' : tipo;
            atualizarEstiloBotoes();
            carregarImoveis();
        }

        function filtrarCategoria(categoria) {
            // Se clicar na mesma categoria selecionada, cancela
            filtroCategoriaAtual = (filtroCategoriaAtual === categoria) ? '' : categoria;
            atualizarEstiloBotoes();
            carregarImoveis();
        }

        function limparFiltros() {
            filtroTipoAtual = '';
            filtroCategoriaAtual = '';
            document.getElementById('input-busca').value = '';
            atualizarEstiloBotoes();
            carregarImoveis();
        }

        async function carregarImoveis() {
            try {
                // Constrói a URL dinamicamente com os filtros selecionados
                let url = '/imoveis?';
                if (filtroTipoAtual) url += `tipo=${filtroTipoAtual}&`;
                if (filtroCategoriaAtual) url += `categoria=${filtroCategoriaAtual}&`;

                const resposta = await fetch(url);
                const imoveis = await resposta.json();

                const container = document.getElementById('lista-imoveis');
                container.innerHTML = '';

                // Filtro adicional local para busca rápida por texto (bairro/cidade)
                const textoBusca = document.getElementById('input-busca').value.toLowerCase();
                const imoveisFiltrados = imoveis.filter(imovel => {
                    if (!textoBusca) return true;
                    return imovel.cidade.toLowerCase().includes(textoBusca) ||
                           imovel.bairro.toLowerCase().includes(textoBusca) ||
                           imovel.titulo.toLowerCase().includes(textoBusca);
                });

                if (imoveisFiltrados.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-3 text-center py-12 bg-white rounded-2xl border border-gray-200">
                            <p class="text-gray-500 font-medium">Nenhum imóvel encontrado com os filtros selecionados.</p>
                            <button onclick="limparFiltros()" class="mt-3 text-sm text-red-600 font-bold hover:underline">Ver todos os imóveis</button>
                        </div>
                    `;
                    return;
                }

                imoveisFiltrados.forEach(imovel => {
                    const isVenda = imovel.tipo.toLowerCase() === 'venda';
                    const badgeColor = isVenda ? 'bg-red-600 text-white' : 'bg-stone-900 text-white';
                    const tipoTexto = isVenda ? 'Venda' : 'Aluguel';

                    const precoFormatado = Number(imovel.preco).toLocaleString('pt-BR', {
                        minimumFractionDigits: 0
                    });
                    const complementoPreco = isVenda ? '' : ' / mês';

                    const card = `
                        <div class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-gray-200 overflow-hidden transition-all duration-300 flex flex-col justify-between">
                            
                            <div class="relative">
                                <img src="${imovel.imagem_url || 'https://via.placeholder.com/400x250'}" alt="${imovel.titulo}" class="w-full h-48 object-cover">
                                <span class="absolute top-3 right-3 ${badgeColor} text-[11px] font-bold px-3 py-1 rounded-full shadow">
                                    ${tipoTexto}
                                </span>
                            </div>

                            <div class="p-5 flex-1 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-sm font-bold text-gray-900 mb-1 leading-snug">${imovel.titulo}</h3>
                                    <div class="text-lg font-extrabold text-gray-900 mb-4">
                                        R$ ${precoFormatado}<span class="text-xs font-normal text-gray-600">${complementoPreco}</span>
                                    </div>
                                </div>

                                <div>
                                    <div class="flex items-center gap-2 text-xs text-gray-600 mb-3 bg-gray-50 p-2 rounded-lg font-semibold">
                                        <span>${imovel.quartos} 🛏️</span>
                                        <span class="text-gray-300">|</span>
                                        <span>${imovel.banheiros} 🚿</span>
                                        <span class="text-gray-300">|</span>
                                        <span>${imovel.area_m2}m²</span>
                                    </div>

                                    <div class="text-xs text-gray-500 font-medium flex items-center gap-1">
                                        📍 ${imovel.bairro}, ${imovel.cidade}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (erro) {
                console.error("Erro ao carregar imóveis:", erro);
                document.getElementById('lista-imoveis').innerHTML = '<p class="text-red-500">Erro ao carregar imóveis do banco de dados.</p>';
            }
        }

        // Carrega imóveis ao iniciar a tela
        carregarImoveis();
    </script>
</body>
</html>
